services:
  - type: web
    name: crm-mini-erp-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: super-secret-jwt-key-for-mini-erp-crm-2026
      - key: DATABASE_URL
        value: file:./dev.db
