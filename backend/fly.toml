# fly.toml app configuration file for CRM Mini ERP Backend

app = "crm-mini-erp-backend"
primary_region = "lon"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  JWT_SECRET = "super-secret-jwt-key-for-mini-erp-crm-2026"
  DATABASE_URL = "file:./dev.db"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
